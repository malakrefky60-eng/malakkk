<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildways - Explore Beyond Expected</title>
    <script>style.css</script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            color: rgb(237, 152, 222);
        }

        /* Background image */

        .hero {
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            background: #333;
            overflow: hidden;
        }

        .background-image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            top: 0;
            left: 0;
            z-index: 0;
        }

        /* Dark overlay */

        .hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.40);
            z-index: 1;
        }

        /* Navigation bar */

        nav {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 7%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #f5c58c;
        }

        .profile {
            padding: 12px 22px;
            border: 1px solid white;
            border-radius: 25px;
            color: white;
            text-decoration: none;
        }

        /* Main content */

        .content {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 50px 20px;
        }

        .content h1 {
            font-size: clamp(38px, 6vw, 75px);
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .content h1 span {
            color: #f5c58c;
        }

        .content p {
            font-size: 19px;
            max-width: 650px;
            line-height: 1.7;
            margin-bottom: 40px;
        }

        /* Booking box */

        .booking-box {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 25px;
            border-radius: 15px;
            display: flex;
            align-items: end;
            gap: 15px;
            width: min(90%, 750px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }

        .booking-field {
            flex: 1;
            text-align: left;
        }

        .booking-field label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 15px;
        }

        .booking-field select,
        .booking-field input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        .book-button {
            padding: 14px 28px;
            background: #dc3e8d;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .book-button:hover {
            background: #a34fc4;
        }

        /* Mobile responsive design */

        @media (max-width: 768px) {

            nav {
                flex-wrap: wrap;
                gap: 20px;
                padding: 20px;
            }

            .logo {
                font-size: 23px;
            }

            .nav-links {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
                gap: 15px;
            }

            .nav-links a {
                font-size: 13px;
            }

            .profile {
                display: none;
            }

            .content {
                padding: 60px 15px;
            }

            .content p {
                font-size: 16px;
            }

            .booking-box {
                flex-direction: column;
                align-items: stretch;
                width: 95%;
            }

            .booking-field {
                width: 100%;
            }

            .book-button {
                width: 100%;
            }
        }

    </style>
</head>

<body>

    <section class="hero">

        <!-- BACKGROUND IMAGE -->
        <img
            src="1,932,000+ Japan Nature Stock Photos and Royalty-Free ..."
            alt="Travel destination"
            class="background-image"
        >

        <!-- NAVIGATION BAR -->
        <nav>

            <div class="logo">WILDWAYS.</div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="tours.html">Tours</a></li>
                <li><a href="airline.html">Airlines</a></li>
            </ul>

            <a href="login.html" class="profile">My Profile</a>

        </nav>

        <!-- MAIN HOMEPAGE CONTENT -->
        <div class="content">

            <h1>
                Explore Beyond <span>Expected</span>
            </h1>

            <p>
                Discover beautiful destinations, create unforgettable
                memories, and experience the world your way.
                Your next adventure starts here.
            </p>

            <!-- BOOKING SECTION -->
            <form class="booking-box" action="#" method="get">

                <div class="booking-field">
                    <label for="destination">Select Where</label>

                    <select id="destination" name="destination" required>
                        <option value="">Choose a destination</option>
                        <option value="paris">Paris</option>
                        <option value="switzerland">Switzerland</option>
                        <option value="italy">Italy</option>
                        <option value="maldives">Maldives</option>
                        <option value="egypt">Egypt</option>
                        <option value="dubai">Dubai</option>
                    </select>
                </div>

                <div class="booking-field">
                    <label for="date">Select Date</label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        required
                    >
                </div>

                <button type="submit" class="book-button">
                    search
                </button>

            </form>

        </div>

    </section>

</body>
</html>
